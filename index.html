<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>의대 시간표</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#6f7583;--line:#dfe4ef;
      --accent:#2563eb;--accent-soft:#eaf1ff;--shadow:0 8px 24px rgba(22,34,61,.08);
      --exam:#ef4444;--exam-soft:#fff1f2;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
    body{padding:20px 18px 40px;max-width:820px;margin:0 auto}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:8px}
    .title-wrap{flex:1;min-width:0}
    .title-wrap h1{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.03em}
    .title-wrap .subline{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
    .date-label{font-size:14px;color:var(--sub);font-weight:700;white-space:nowrap}
    .grade-select{
      height:38px;min-width:82px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);
      padding:0 30px 0 12px;font-size:14px;font-weight:800;appearance:none;flex:0 0 auto;
      background-image:linear-gradient(45deg, transparent 50%, #7b8290 50%),linear-gradient(135deg, #7b8290 50%, transparent 50%);
      background-position:calc(100% - 17px) calc(50% - 1px), calc(100% - 12px) calc(50% - 1px);
      background-size:6px 6px,6px 6px;background-repeat:no-repeat;
    }
    .nav-row{display:flex;gap:10px;align-items:center;margin-top:16px}
    .date-button{
      flex:1;border:1px solid var(--line);background:#fff;border-radius:18px;height:64px;
      display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;letter-spacing:-.03em;
      box-shadow:var(--shadow);cursor:pointer;
    }
    .icon-btn{
      width:58px;height:58px;flex:0 0 58px;border-radius:18px;border:1px solid var(--line);background:#fff;
      display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text);
      box-shadow:var(--shadow);cursor:pointer;
    }
    .cards{margin-top:22px;display:flex;flex-direction:column;gap:18px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 22px 20px;
      box-shadow:var(--shadow);
    }
    .card.exam-card{border-color:#fecdd3;background:linear-gradient(180deg,#fff 0%, #fff7f8 100%)}
    .card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
    .period-pill{
      padding:10px 16px;border-radius:999px;background:var(--accent-soft);color:#233970;
      border:1px solid #c6d4ff;font-size:18px;font-weight:800;
    }
    .time{font-size:17px;color:var(--sub);font-weight:800}
    .course{font-size:26px;font-weight:900;line-height:1.28;letter-spacing:-.04em}
    .meta{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:17px;font-weight:700}
    .note{margin-top:12px;color:#b45309;font-size:15px;font-weight:800}
    .exam-badge{
      display:inline-flex;align-items:center;gap:6px;margin-top:12px;
      padding:8px 12px;border-radius:999px;background:var(--exam-soft);color:#b91c1c;
      border:1px solid #fecdd3;font-size:14px;font-weight:900;
    }
    .empty-course{font-size:22px;color:var(--text);font-weight:900}
    .multi-list{margin-top:16px;display:flex;flex-direction:column;gap:12px}
    .choice{border:1px dashed #cad3e6;border-radius:18px;padding:14px 16px;background:#fbfcff}
    .choice.exam-choice{border-color:#fda4af;background:#fff7f7}
    .choice .choice-title{font-size:19px;font-weight:900;line-height:1.3;letter-spacing:-.03em}
    .choice .choice-meta{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:15px;font-weight:700}
    .footer-tip{margin-top:22px;color:var(--sub);font-size:14px;text-align:center;line-height:1.6}
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(16,24,40,.18);display:none;align-items:center;justify-content:center;
      padding:18px;z-index:1000;
    }
    .modal-backdrop.open{display:flex}
    .modal{
      width:min(640px,100%);background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 24px 80px rgba(15,23,42,.2);
      padding:22px 18px 18px;
    }
    .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:4px 8px}
    .cal-title{font-size:22px;font-weight:900;letter-spacing:-.03em}
    .cal-nav{display:flex;gap:8px}
    .mini-btn{
      width:52px;height:52px;border:none;background:#eef4ff;color:var(--accent);border-radius:18px;
      font-size:26px;font-weight:900;cursor:pointer;
    }
    .legend{display:flex;gap:12px;align-items:center;padding:0 8px 10px;color:var(--sub);font-size:14px;font-weight:800}
    .legend-dot{display:inline-flex;width:10px;height:10px;border-radius:50%;background:var(--exam)}
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .weekdays div{padding:10px 0;text-align:center;color:#a0a4ad;font-weight:800}
    .day{
      position:relative;border:none;background:#fff;border-radius:18px;min-height:62px;font-size:22px;font-weight:800;cursor:pointer;color:var(--text)
    }
    .day.other{color:#c7ccd6}
    .day.selected{background:var(--accent);color:#fff}
    .day.today-outline{outline:2px solid #9ec0ff;outline-offset:-2px}
    .day.has-exam::after{
      content:"★";position:absolute;right:8px;top:6px;font-size:14px;color:var(--exam);line-height:1
    }
    .day.selected.has-exam::after{color:#fff}
    .modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:0 6px}
    .reset-btn,.apply-btn{
      border:none;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:900;cursor:pointer;
    }
    .reset-btn{background:#f2f4f8;color:var(--text)}
    .apply-btn{width:68px;height:68px;border-radius:50%;padding:0;background:var(--accent);color:#fff;font-size:36px}
    @media (max-width:640px){
      body{padding:16px 12px 30px}
      .topbar{align-items:flex-start}
      .title-wrap h1{font-size:23px}
      .title-wrap .subline{gap:8px;margin-top:8px}
      .grade-select{height:36px;min-width:78px;font-size:13px;padding:0 28px 0 11px;border-radius:11px}
      .date-label{font-size:12px}
      .nav-row{gap:8px;margin-top:14px}
      .date-button{height:58px;font-size:20px;border-radius:16px}
      .icon-btn{width:52px;height:52px;flex-basis:52px;border-radius:16px;font-size:20px}
      .cards{margin-top:16px;gap:14px}
      .card{padding:18px 18px 16px;border-radius:22px}
      .course{font-size:20px}
      .period-pill{font-size:15px;padding:8px 12px}
      .time{font-size:15px}
      .meta{font-size:15px;gap:10px}
      .modal{padding:16px 12px 14px}
      .day{min-height:50px;font-size:17px}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-wrap">
      <h1 id="pageTitle">의예2 시간표</h1>
      <div class="subline">
        <select id="gradeSelect" class="grade-select"></select>
        <div id="todayLabel" class="date-label"></div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button id="dateButton" class="date-button" type="button"></button>
    <button id="prevBtn" class="icon-btn" type="button">◀</button>
    <button id="nextBtn" class="icon-btn" type="button">▶</button>
  </div>

  <div id="cards" class="cards"></div>
  

  <div id="calendarModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="cal-head">
        <div id="calendarTitle" class="cal-title"></div>
        <div class="cal-nav">
          <button id="calPrev" class="mini-btn" type="button">‹</button>
          <button id="calNext" class="mini-btn" type="button">›</button>
        </div>
      </div>
      <div class="legend"><span class="legend-dot"></span><span>현재 선택한 학년의 시험일</span></div>
      <div class="weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div id="calendarGrid" class="days"></div>
      <div class="modal-footer">
        <button id="resetToday" class="reset-btn" type="button">오늘/기본일로</button>
        <button id="applyDate" class="apply-btn" type="button">✓</button>
      </div>
    </div>
  </div>

  <script>
    const DAY_NAMES = ["일","월","화","수","목","금","토"];
    let DATA = null;
    let selectedGrade = "의예2";
    let selectedDate = null;
    let tempDate = null;
    let visibleMonth = null;

    const pageTitle = document.getElementById('pageTitle');
    const todayLabel = document.getElementById('todayLabel');
    const gradeSelect = document.getElementById('gradeSelect');
    const dateButton = document.getElementById('dateButton');
    const cards = document.getElementById('cards');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const modal = document.getElementById('calendarModal');
    const calendarTitle = document.getElementById('calendarTitle');
    const calendarGrid = document.getElementById('calendarGrid');
    const calPrev = document.getElementById('calPrev');
    const calNext = document.getElementById('calNext');
    const resetToday = document.getElementById('resetToday');
    const applyDate = document.getElementById('applyDate');

    function iso(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
    function parseIso(str){
      const [y,m,d] = str.split('-').map(Number);
      return new Date(y, m-1, d);
    }
    function formatHeaderDate(str){
      const d = parseIso(str);
      return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
    }
    function formatLabelDate(str){
      const d = parseIso(str);
      return `${str} (${DAY_NAMES[d.getDay()]}요일)`;
    }
    function escapeHtml(value){
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function getAllDatesForGrade(grade){
      return Object.keys(DATA.schedules[grade] || {}).sort();
    }
    function getExamDateSet(grade){
      return new Set(DATA.examDates[grade] || []);
    }
    function getDefaultDate(grade){
      const stored = localStorage.getItem(`timetable-date-${grade}`);
      const dates = getAllDatesForGrade(grade);
      if (stored && dates.includes(stored)) return stored;
      const today = iso(new Date());
      if (dates.includes(today)) return today;
      return dates[0];
    }
    function buildGradeOptions(){
      gradeSelect.innerHTML = '';
      DATA.meta.gradeOrder.forEach(grade => {
        const opt = document.createElement('option');
        opt.value = grade;
        opt.textContent = grade;
        gradeSelect.appendChild(opt);
      });
    }
    function updateNavState(){
      const dates = getAllDatesForGrade(selectedGrade);
      const idx = dates.indexOf(selectedDate);
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= dates.length - 1;
      prevBtn.style.opacity = prevBtn.disabled ? '.45' : '1';
      nextBtn.style.opacity = nextBtn.disabled ? '.45' : '1';
    }
    function render(){
      pageTitle.textContent = `${selectedGrade} 시간표`;
      todayLabel.textContent = formatLabelDate(selectedDate);
      dateButton.textContent = formatHeaderDate(selectedDate);
      gradeSelect.value = selectedGrade;

      const periods = DATA.meta.periods;
      const dayItems = DATA.schedules[selectedGrade][selectedDate] || [];
      const periodMap = new Map();

      dayItems.forEach(item => {
        if (!periodMap.has(item.period)) periodMap.set(item.period, []);
        periodMap.get(item.period).push(item);
      });

      cards.innerHTML = '';

      periods.forEach(slot => {
        const wrap = document.createElement('div');
        wrap.className = 'card';

        const list = periodMap.get(slot.period) || [];
        const head = `
          <div class="card-head">
            <div class="period-pill">${slot.period}교시</div>
            <div class="time">${slot.start}–${slot.end}</div>
          </div>
        `;

        if (!list.length) {
          wrap.innerHTML = `${head}<div class="empty-course">(교과목명 없음)</div>`;
          cards.appendChild(wrap);
          return;
        }

        const anyExam = list.some(item => item.isExam);
        if (anyExam) wrap.classList.add('exam-card');

        if (list.length === 1) {
          const item = list[0];
          wrap.innerHTML = `
            ${head}
            <div class="course">${escapeHtml(item.course || '(교과목명 없음)')}</div>
            <div class="meta">
              <span>👨‍🏫 ${escapeHtml(item.prof || '-')}</span>
              <span>🏫 ${escapeHtml(item.room || '-')}</span>
              <span>📝 ${escapeHtml(item.topic || '-')}</span>
            </div>
            ${item.isExam ? `<div class="exam-badge">★ 시험 일정</div>` : ''}
            ${item.note ? `<div class="note">변경사항: ${escapeHtml(item.note)}</div>` : ''}
          `;
          cards.appendChild(wrap);
          return;
        }

        wrap.innerHTML = `${head}<div class="course">선택/분반 수업 ${list.length}개</div>`;
        const multi = document.createElement('div');
        multi.className = 'multi-list';

        list.forEach(item => {
          const div = document.createElement('div');
          div.className = `choice${item.isExam ? ' exam-choice' : ''}`;
          div.innerHTML = `
            <div class="choice-title">${escapeHtml(item.course || '(교과목명 없음)')}</div>
            <div class="choice-meta">
              <span>👨‍🏫 ${escapeHtml(item.prof || '-')}</span>
              <span>🏫 ${escapeHtml(item.room || '-')}</span>
              <span>📝 ${escapeHtml(item.topic || '-')}</span>
            </div>
            ${item.isExam ? `<div class="exam-badge">★ 시험 일정</div>` : ''}
            ${item.note ? `<div class="note">변경사항: ${escapeHtml(item.note)}</div>` : ''}
          `;
          multi.appendChild(div);
        });
        wrap.appendChild(multi);
        cards.appendChild(wrap);
      });

      updateNavState();
    }
    function moveDay(step){
      const dates = getAllDatesForGrade(selectedGrade);
      const idx = dates.indexOf(selectedDate);
      const nextIdx = idx + step;
      if (nextIdx < 0 || nextIdx >= dates.length) return;
      selectedDate = dates[nextIdx];
      localStorage.setItem(`timetable-date-${selectedGrade}`, selectedDate);
      render();
    }
    function openCalendar(){
      tempDate = parseIso(selectedDate);
      visibleMonth = new Date(tempDate.getFullYear(), tempDate.getMonth(), 1);
      renderCalendar();
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }
    function closeCalendar(){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }
    function renderCalendar(){
      calendarTitle.textContent = `${visibleMonth.getFullYear()}년 ${visibleMonth.getMonth()+1}월`;
      calendarGrid.innerHTML = '';
      const examSet = getExamDateSet(selectedGrade);

      const firstDay = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), 1);
      const lastDay = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth()+1, 0);

      for (let i = 0; i < firstDay.getDay(); i++){
        const blank = document.createElement('button');
        blank.className = 'day other';
        blank.type = 'button';
        const prevDate = new Date(firstDay);
        prevDate.setDate(firstDay.getDate() - (firstDay.getDay() - i));
        const prevIso = iso(prevDate);
        blank.textContent = prevDate.getDate();
        if (examSet.has(prevIso)) blank.classList.add('has-exam');
        blank.onclick = () => {
          visibleMonth = new Date(prevDate.getFullYear(), prevDate.getMonth(), 1);
          tempDate = new Date(prevDate);
          renderCalendar();
        };
        calendarGrid.appendChild(blank);
      }

      for (let day = 1; day <= lastDay.getDate(); day++){
        const d = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), day);
        const btn = document.createElement('button');
        btn.className = 'day';
        btn.type = 'button';
        btn.textContent = day;
        const dIso = iso(d);
        const todayIso = iso(new Date());

        if (tempDate && iso(tempDate) === dIso) btn.classList.add('selected');
        if (todayIso === dIso) btn.classList.add('today-outline');
        if (examSet.has(dIso)) btn.classList.add('has-exam');

        btn.onclick = () => {
          tempDate = d;
          renderCalendar();
        };
        calendarGrid.appendChild(btn);
      }

      const cellsUsed = firstDay.getDay() + lastDay.getDate();
      const trailing = (7 - (cellsUsed % 7)) % 7;
      for (let i = 1; i <= trailing; i++){
        const blank = document.createElement('button');
        blank.className = 'day other';
        blank.type = 'button';
        const nextDate = new Date(lastDay);
        nextDate.setDate(lastDay.getDate() + i);
        const nextIso = iso(nextDate);
        blank.textContent = nextDate.getDate();
        if (examSet.has(nextIso)) blank.classList.add('has-exam');
        blank.onclick = () => {
          visibleMonth = new Date(nextDate.getFullYear(), nextDate.getMonth(), 1);
          tempDate = new Date(nextDate);
          renderCalendar();
        };
        calendarGrid.appendChild(blank);
      }
    }
    function nearestAvailableDate(targetIso){
      const dates = getAllDatesForGrade(selectedGrade);
      if (dates.includes(targetIso)) return targetIso;
      let nearest = dates[0];
      let bestGap = Infinity;
      const target = parseIso(targetIso).getTime();
      dates.forEach(d => {
        const gap = Math.abs(parseIso(d).getTime() - target);
        if (gap < bestGap){
          bestGap = gap;
          nearest = d;
        }
      });
      return nearest;
    }
    async function init(){
      const res = await fetch('./schedule.json');
      DATA = await res.json();

      buildGradeOptions();

      selectedGrade = localStorage.getItem('timetable-grade') || DATA.meta.defaultGrade || '의예2';
      if (!DATA.meta.gradeOrder.includes(selectedGrade)) selectedGrade = DATA.meta.defaultGrade || DATA.meta.gradeOrder[0];
      selectedDate = getDefaultDate(selectedGrade);

      gradeSelect.addEventListener('change', (e) => {
        selectedGrade = e.target.value;
        localStorage.setItem('timetable-grade', selectedGrade);
        selectedDate = getDefaultDate(selectedGrade);
        render();
      });

      prevBtn.addEventListener('click', () => moveDay(-1));
      nextBtn.addEventListener('click', () => moveDay(1));
      dateButton.addEventListener('click', openCalendar);

      calPrev.addEventListener('click', () => {
        visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() - 1, 1);
        renderCalendar();
      });

      calNext.addEventListener('click', () => {
        visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 1);
        renderCalendar();
      });

      resetToday.addEventListener('click', () => {
        const dates = getAllDatesForGrade(selectedGrade);
        const today = iso(new Date());
        tempDate = parseIso(dates.includes(today) ? today : dates[0]);
        visibleMonth = new Date(tempDate.getFullYear(), tempDate.getMonth(), 1);
        renderCalendar();
      });

      applyDate.addEventListener('click', () => {
        if (!tempDate) return;
        const picked = iso(tempDate);
        selectedDate = nearestAvailableDate(picked);
        localStorage.setItem(`timetable-date-${selectedGrade}`, selectedDate);
        closeCalendar();
        render();
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeCalendar();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeCalendar();
      });

      render();
    }
    init();
  </script>
</body>
</html>
