<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>의예2 오늘 시간표</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #121626;
      --text: #e8ecff;
      --muted: rgba(232,236,255,.7);
      --line: rgba(232,236,255,.12);
      --accent: #7aa2ff;
      --warn: #ffcc66;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #111827;
        --muted: rgba(17,24,39,.65);
        --line: rgba(17,24,39,.12);
        --accent: #2952ff;
        --warn: #b45309;
      }
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: env(safe-area-inset-top);
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0;
      letter-spacing: -0.2px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    input[type="date"] {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 16px;
      outline: none;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: translateY(1px); }
    .cards {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px;
      display: grid;
      gap: 8px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(122,162,255,.14);
      border: 1px solid rgba(122,162,255,.28);
      color: var(--text);
      font-size: 13px;
      letter-spacing: -.1px;
      white-space: nowrap;
    }
    .time {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .course {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.25;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .meta span {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .note {
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      color: var(--warn);
      font-size: 13px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    .empty {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      color: var(--muted);
      line-height: 1.5;
    }
    footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .kbd {
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-row">
        <h1>의예2 시간표</h1>
        <div class="sub" id="todayLabel"></div>
      </div>
      <div class="controls">
        <input id="datePicker" type="date" />
        <button id="prevBtn" aria-label="이전날">◀︎</button>
        <button id="nextBtn" aria-label="다음날">▶︎</button>
      </div>
    </header>

    <main>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" style="display:none;"></div>
    </main>

    <footer>
      <div>데이터: 업로드한 엑셀(의예2 시트) 기반</div>
      <div>팁: 아이폰에서 Safari → 공유 → <span class="kbd">홈 화면에 추가</span> 하면 앱처럼 열려.</div>
    </footer>
  </div>

  <script>
    const SCHEDULE = JSON.parse(document.getElementById("SCHEDULE_DATA").textContent);

    function kstTodayISO() {
      // Use Asia/Seoul explicitly for consistency
      const fmt = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric", month: "2-digit", day: "2-digit"
      });
      return fmt.format(new Date()); // YYYY-MM-DD in en-CA
    }

    function kstWeekdayLabel(isoDate) {
      const d = new Date(isoDate + "T00:00:00");
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        weekday: "long"
      }).format(d);
    }

    function render(dateISO) {
      const cardsEl = document.getElementById("cards");
      const emptyEl = document.getElementById("empty");
      cardsEl.innerHTML = "";
      emptyEl.style.display = "none";

      const day = SCHEDULE[dateISO] || [];
      const weekday = kstWeekdayLabel(dateISO);

      document.getElementById("todayLabel").textContent = `${dateISO} (${weekday})`;

      if (!day.length) {
        emptyEl.style.display = "block";
        emptyEl.textContent = "오늘은 등록된 수업이 없어. (공휴일/공강/미입력)";
        return;
      }

      day.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const top = document.createElement("div");
        top.className = "card-top";

        const pill = document.createElement("div");
        pill.className = "pill";
        pill.textContent = `${item.period}교시`;

        const time = document.createElement("div");
        time.className = "time";
        const t = (item.start && item.end) ? `${item.start}–${item.end}` : (item.start || "");
        time.textContent = t;

        top.appendChild(pill);
        top.appendChild(time);

        const course = document.createElement("div");
        course.className = "course";
        course.textContent = item.course || "(교과목명 없음)";

        const meta = document.createElement("div");
        meta.className = "meta";
        const prof = (item.prof || "").trim();
        const room = (item.room || "").trim();
        const topic = (item.topic || "").trim();

        if (prof) {
          const s = document.createElement("span");
          s.textContent = `👨‍🏫 ${prof}`;
          meta.appendChild(s);
        }
        if (room) {
          const s = document.createElement("span");
          s.textContent = `🏫 ${room}`;
          meta.appendChild(s);
        }
        if (topic) {
          const s = document.createElement("span");
          s.textContent = `📝 ${topic}`;
          meta.appendChild(s);
        }

        card.appendChild(top);
        card.appendChild(course);
        if (meta.childNodes.length) card.appendChild(meta);

        const note = (item.note || "").trim();
        if (note) {
          const n = document.createElement("div");
          n.className = "note";
          n.textContent = "비고: " + note;
          card.appendChild(n);
        }

        cardsEl.appendChild(card);
      });
    }

    function shiftDate(isoDate, deltaDays) {
      const d = new Date(isoDate + "T00:00:00");
      d.setDate(d.getDate() + deltaDays);
      // format to YYYY-MM-DD
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }

    const picker = document.getElementById("datePicker");
    const initial = kstTodayISO();
    picker.value = initial;
    render(initial);

    picker.addEventListener("change", () => render(picker.value));
    document.getElementById("prevBtn").addEventListener("click", () => {
      picker.value = shiftDate(picker.value, -1);
      render(picker.value);
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      picker.value = shiftDate(picker.value, 1);
      render(picker.value);
    });
  </script>
</body>
</html>
